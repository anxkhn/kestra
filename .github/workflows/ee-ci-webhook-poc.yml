name: EE CI via Kestra webhook (POC)

# Proof-of-concept: run the EE compile/CI for this OSS PR's ref on a Kestra
# instance and surface the result inline in the Actions log + job summary.
# The webhook URL (including its key) lives in the KESTRA_CI_WEBHOOK_URL_POC
# repo secret. The webhook runs synchronously (wait: true, returnOutputs: true)
# and returns a flat JSON map: { compileFailed, compileError, testFailed, testReport }.

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to test"
        required: false

concurrency:
  group: ee-ci-webhook-poc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ee-ci:
    name: EE compile/CI
    runs-on: ubuntu-latest
    if: github.repository == 'kestra-io/kestra'
    steps:
      - name: Trigger EE CI webhook and surface result
        env:
          WEBHOOK_URL: ${{ secrets.KESTRA_CI_WEBHOOK_URL_POC }}
          REF: ${{ inputs.ref || github.head_ref || github.ref_name }}
          # On a pull_request these carry the OSS PR context so the flow can post
          # the EE CI result back to the PR's head commit as a GitHub status.
          # Empty on workflow_dispatch — the callback is gated on commit_sha.
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail

          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo "::error::KESTRA_CI_WEBHOOK_URL_POC secret is not set."
            exit 1
          fi

          echo "Triggering EE CI for ref: $REF"
          # integrateWithGithub turns on the commit-status callback; the flow
          # gates the actual post on commit_sha being present too.
          PAYLOAD=$(jq -n \
            --arg ref        "$REF" \
            --arg commit_sha "${COMMIT_SHA:-}" \
            --arg pr_number  "${PR_NUMBER:-}" \
            --arg pr_repo    "${PR_REPO:-}" \
            '{ref: $ref, commit_sha: $commit_sha, pr_number: $pr_number, pr_repo: $pr_repo, integrateWithGithub: true}')

          BODY=$(mktemp)
          STATUS=$(curl -sS -o "$BODY" -w '%{http_code}' \
            -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            --max-time 1800 \
            -d "$PAYLOAD" || echo "000")

          echo "Webhook HTTP status: $STATUS"

          # The body must be JSON with our outputs even on HTTP 500 (a compile
          # failure makes the flow terminate FAILED). A non-JSON body means an
          # infra/auth error, not a compile result — surface it raw and fail.
          if ! jq -e . "$BODY" >/dev/null 2>&1; then
            echo "::error::Webhook did not return a JSON result (HTTP $STATUS). Raw response:"
            cat "$BODY"
            exit 1
          fi

          COMPILE_FAILED=$(jq -r '.compileFailed // ""' "$BODY")
          COMPILE_ERROR=$(jq -r '.compileError // ""' "$BODY")
          TEST_FAILED=$(jq -r '.testFailed // ""' "$BODY")
          TEST_REPORT=$(jq -r '.testReport // ""' "$BODY")

          # The flow always sets compileFailed to "true"/"false". An empty value
          # means the Kestra flow terminated BEFORE producing a verdict (e.g. a
          # transient Kubernetes pod-scheduling timeout, or a clone/auth error).
          # That is inconclusive, NOT a pass — fail the check so it isn't a false
          # green, and surface the raw response + status for debugging.
          if [ "$COMPILE_FAILED" != "true" ] && [ "$COMPILE_FAILED" != "false" ]; then
            {
              echo "## :warning: EE CI inconclusive for \`$REF\`"
              echo ""
              echo "The Kestra flow did not return a compile verdict (HTTP $STATUS)."
              echo "This is usually a transient infra error (e.g. a runner pod failed to schedule). Re-run the job."
              echo ""
              echo "<details><summary>Raw webhook response</summary>"
              echo ""
              echo '```json'
              cat "$BODY"
              echo '```'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::group::Raw webhook response (HTTP $STATUS)"
            cat "$BODY"
            echo "::endgroup::"
            echo "::error::EE CI inconclusive for ref $REF (no compile verdict; HTTP $STATUS). Likely a transient runner error — re-run the job."
            exit 1
          fi

          {
            echo "## EE CI result for \`$REF\`"
            echo ""
            if [ "$COMPILE_FAILED" = "true" ]; then
              echo "### :x: EE compilation failed"
              echo ""
              echo '```'
              echo "$COMPILE_ERROR"
              echo '```'
            else
              echo "### :white_check_mark: EE compilation passed"
            fi
            if [ -n "$TEST_FAILED" ] || [ -n "$TEST_REPORT" ]; then
              echo ""
              if [ "$TEST_FAILED" = "true" ]; then
                echo "### :x: EE tests failed"
              else
                echo "### :white_check_mark: EE tests passed"
              fi
              if [ -n "$TEST_REPORT" ]; then
                echo ""
                echo "$TEST_REPORT"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$COMPILE_FAILED" = "true" ]; then
            echo "::group::EE compile error"
            echo "$COMPILE_ERROR"
            echo "::endgroup::"
            echo "::error::EE compilation failed for ref $REF"
            exit 1
          fi

          if [ "$TEST_FAILED" = "true" ]; then
            echo "::group::EE test report"
            echo "$TEST_REPORT"
            echo "::endgroup::"
            echo "::error::EE tests failed for ref $REF"
            exit 1
          fi

          echo "EE CI passed for ref $REF"
